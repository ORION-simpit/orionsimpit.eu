<!doctype html>
<html lang="fr" data-release-channel="alpha" data-release-name="ALPHA" data-release-version="0.1.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#010405">
  <meta name="description" content="ORION — Fly the Ship. Forget the Controls.">
  <meta property="og:title" content="ORION">
  <meta property="og:description" content="Fly the Ship. Forget the Controls.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orionsimpit.eu/">
  <meta name="robots" content="noindex,nofollow">
  <title>ORION — Fly the Ship. Forget the Controls.</title>
  <link rel="stylesheet" href="assets/styles.css?v=15.5">
  <script src="assets/reveal.js?v=15.5" defer></script>
  <script src="assets/public.js?v=15.5" defer></script>
</head>
<body>
  <main id="orion" class="orion-reveal" data-active-release="alpha" aria-label="ORION — Fly the Ship. Forget the Controls.">
    <div class="orion-master" data-reveal-master aria-hidden="true"></div>
    <div class="orion-ambient" data-reveal-ambient aria-hidden="true"></div>
    <div class="orion-corona" data-reveal-corona aria-hidden="true"></div>
    <div class="orion-boot-space" data-reveal-space aria-hidden="true"></div>

    <button id="boot-skip" class="boot-skip" type="button">Passer l’initialisation</button>

    <div class="orion-progress-wrap" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="solar-stroke" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff9e9"/>
            <stop offset=".5" stop-color="#ffe1ad"/>
            <stop offset="1" stop-color="#ffbd73"/>
          </linearGradient>
        </defs>
        <circle class="orion-track" cx="50" cy="50" r="50"/>
        <circle class="orion-progress" data-reveal-progress pathLength="100" cx="50" cy="50" r="50"/>
      </svg>
    </div>

    <div class="orion-head" data-reveal-head aria-hidden="true"></div>
    <div class="orion-i" data-reveal-i aria-hidden="true"><i></i><b></b><span></span><em></em></div>

    <div class="boot-status" data-reveal-hud aria-live="polite">
      <div class="boot-status-head"><span id="boot-index">01.</span><span id="boot-state">INITIALISATION</span><b id="boot-percent">0%</b></div>
      <div id="boot-lines"></div>
      <strong id="boot-nominal">ALL SYSTEMS<br>STANDBY</strong>
    </div>

    <div class="orion-flash" data-reveal-flash aria-hidden="true"></div>
    <div class="asset-error" data-reveal-error role="alert">ERREUR ASSET — L’image ORION n’a pas pu être décodée.</div>

    <div id="release-version" class="landing-release-version" aria-label="ALPHA version 0.1.0"><strong>ALPHA</strong><small>v0.1.0</small></div>

    <a class="landing-hotspot landing-hotspot-apply" href="https://alpha.orionsimpit.eu/">
      <span class="sr-only">Rejoindre l’Alpha ORION</span>
    </a>
    <a class="landing-hotspot landing-hotspot-private" href="https://alpha.orionsimpit.eu/">
      <span class="sr-only">Accès privé Alpha Test</span>
    </a>
  </main>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020407">
  <meta name="description" content="ORION — Fly the Ship. Forget the Controls.">
  <meta property="og:title" content="ORION">
  <meta property="og:description" content="Something big is coming.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orionsimpit.eu/">
  <title>ORION — Fly the Ship. Forget the Controls.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="teaser-shell">
    <section class="teaser" aria-labelledby="orion-title">
      <div class="orb" aria-hidden="true">
        <div class="orb-ring"></div>
        <div class="brand-block">
          <h1 id="orion-title">ORION</h1>
          <p class="tagline">FLY THE SHIP. FORGET THE CONTROLS.</p>
        </div>
      </div>

      <div class="coming-block">
        <p class="coming">SOMETHING BIG IS COMING.</p>
        <span class="divider" aria-hidden="true"></span>
        <p class="whisper">Le futur de la simulation se prépare.</p>
        <span class="divider short" aria-hidden="true"></span>
        <button class="invite" type="button" disabled aria-disabled="true">RECEVOIR UNE INVITATION</button>
        <p class="invite-note">Invitations bientôt disponibles.</p>
      </div>
    </section>
  </main>

  <footer class="teaser-footer">
    <span>© 2026 ORION</span>
  </footer>
</body>
</html>

name: Cloudflare Pages preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "index.html"
      - "assets/**"
      - "privacy/**"
      - "terms/**"
      - "release.json"
      - ".github/workflows/cloudflare-pages-preview.yml"

concurrency:
  group: public-cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    name: Deploy public landing preview
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-preview
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Validate preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Missing CLOUDFLARE_PAGES_PROJECT variable"; exit 1; }

      - name: Deploy isolated Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy .
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=public-pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-message="ORION public PR #${{ github.event.pull_request.number }} preview"

      - name: Publish preview link in job summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## ORION public landing preview"
            echo
            echo "- Deployment: $PREVIEW_URL"
            echo "- Source PR: #${{ github.event.pull_request.number }}"
            echo "- Production domain unchanged: https://orionsimpit.eu"
          } >> "$GITHUB_STEP_SUMMARY"
